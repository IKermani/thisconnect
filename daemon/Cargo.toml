[package]
name = "thisconnect-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "thisconnectd"
path = "src/main.rs"

[dependencies]
thisconnect-shared = { path = "../shared" }
thisconnect-proxy = { path = "../proxy" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }

# `auth` is not cfg-gated, so these must resolve on every target. keyring's "v1"
# meta-feature picks the platform store: Secret Service on Linux, Keychain on macOS.
totp-rs = { version = "6", features = ["otpauth", "zeroize"] }
keyring = { version = "4", features = ["v1"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }
core-foundation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# Relaxes IPC peer authentication for local development. MUST be off in release
# artifacts; CI asserts this. See docs/SPEC.md 7.3.
dev-insecure-ipc = []

[lints]
workspace = true
