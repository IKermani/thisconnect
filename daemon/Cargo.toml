[package]
name = "thisconnect-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "thisconnectd"
path = "src/main.rs"

[dependencies]
thisconnect-shared = { path = "../shared" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
totp-rs = { version = "6", features = ["otpauth", "zeroize"] }
keyring = { version = "4", features = ["v1"] }

[features]
# Relaxes IPC peer authentication for local development. MUST be off in release
# artifacts; CI asserts this. See docs/SPEC.md 7.3.
dev-insecure-ipc = []

[lints]
workspace = true
