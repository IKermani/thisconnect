[workspace]
resolver = "2"
members = ["shared", "daemon", "proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/thisconnect/thisconnect"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
base64 = "0.22"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
