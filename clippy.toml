# Every entry here is a DNS leak. See docs/SPEC.md 5.4 and 9.
#
# The fail-closed bans (socket2's set_freebind_v4/v6) are NOT here: those symbols only exist
# under cfg(linux), so naming them makes clippy warn "does not refer to a reachable function"
# on macOS, which `-D warnings` turns into a build failure. They are enforced by a grep step
# in .github/workflows/ci.yml instead.
disallowed-methods = [
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "system resolver: leaks every hostname outside the tunnel. Use the tunnel-pinned resolver." },
    { path = "tokio::net::lookup_host", reason = "system resolver: leaks every hostname outside the tunnel. Use the tunnel-pinned resolver." },
    # tokio has its OWN sealed ToSocketAddrs whose `&str` / `(&str, u16)` impls call
    # std::net::ToSocketAddrs on a blocking pool from INSIDE tokio, where the ban above cannot
    # reach. So the socket constructors that accept it are banned wholesale; the handful of
    # call sites that pass an already-resolved SocketAddr carry a scoped #[allow] naming this.
    { path = "tokio::net::TcpStream::connect", reason = "accepts a hostname and resolves it with getaddrinfo. Dial through egress::TunEgress, which takes a SocketAddr." },
    { path = "tokio::net::TcpListener::bind", reason = "accepts a hostname and resolves it with getaddrinfo. Bind a SocketAddr through listener::bind_tcp." },
    { path = "tokio::net::UdpSocket::bind", reason = "accepts a hostname and resolves it with getaddrinfo. Build UDP sockets via egress, which uses UdpSocket::from_std." },
    { path = "tokio::net::UdpSocket::connect", reason = "accepts a hostname and resolves it with getaddrinfo. Connect a SocketAddr obtained from the tunnel-pinned resolver." },
    { path = "tokio::net::UdpSocket::send_to", reason = "accepts a hostname and resolves it with getaddrinfo. Send to a SocketAddr obtained from the tunnel-pinned resolver." },
    { path = "std::net::TcpStream::connect", reason = "resolves hostnames with getaddrinfo, outside the tunnel." },
    { path = "std::net::TcpListener::bind", reason = "resolves hostnames with getaddrinfo, outside the tunnel." },
    { path = "std::net::UdpSocket::bind", reason = "resolves hostnames with getaddrinfo, outside the tunnel." },
    { path = "std::net::UdpSocket::connect", reason = "resolves hostnames with getaddrinfo, outside the tunnel." },
    { path = "std::net::UdpSocket::send_to", reason = "resolves hostnames with getaddrinfo, outside the tunnel." },
]
